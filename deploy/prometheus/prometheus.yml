global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cee-exporter
    static_configs:
      # cee-exporter's /metrics port (ADR-006) — not the CEPA listener port.
      #
      # host.docker.internal reaches an exporter running on the Docker host.
      # For an exporter on another machine, replace it with that host:port.
      # Keep job_name as "cee-exporter": the alert rules in alerts.yml gate on
      # up{job="cee-exporter"}, and renaming the job silently disables them.
      - targets: ['host.docker.internal:9228']
