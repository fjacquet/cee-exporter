# Prometheus + Grafana for cee-exporter.
#
# Brings up a scrape target and a preprovisioned dashboard against a running
# cee-exporter. The exporter itself is NOT in this stack: it usually runs as a
# systemd unit or on a host that CEE is already configured to publish to, and
# moving it into a container would change the source address CEE sees — which
# is the `remote` label on the publisher-liveness metrics.
#
#   docker compose -f deploy/compose.yaml up -d
#
# Set CEE_EXPORTER_TARGET to the exporter's metrics endpoint as reachable from
# inside the Prometheus container. On Linux the default below works because the
# stack uses host networking for Prometheus; override it for anything else:
#
#   CEE_EXPORTER_TARGET=10.0.4.158:9228 docker compose -f deploy/compose.yaml up -d
#
# Grafana listens on :3000 (admin/admin on first login, change it).
# Prometheus listens on :9090.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cee-prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cee-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
