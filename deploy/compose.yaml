# Prometheus + Grafana for cee-exporter.
#
# Brings up a scrape target and a preprovisioned dashboard against a running
# cee-exporter. The exporter itself is NOT in this stack: it usually runs as a
# systemd unit on a host that CEE is already configured to publish to, and
# containerising it would change the source address CEE sees — which is the
# `remote` label on the publisher-liveness metrics.
#
#   docker compose -f deploy/compose.yaml up -d
#
# Grafana is on 127.0.0.1:3000, Prometheus on 127.0.0.1:9090 — loopback only.
# Neither service authenticates its own port, so exposing them means exposing
# unauthenticated read access to your audit-pipeline telemetry. To reach them
# from elsewhere, tunnel (`ssh -L 3000:localhost:3000 host`) or front them with
# an authenticating reverse proxy. Changing these to 0.0.0.0 publishes them to
# every interface; do that only behind a firewall you control.
#
# Before the first start:  cp .env.example .env && $EDITOR .env
# Compose requires GF_SECURITY_ADMIN_PASSWORD for every subcommand, so an
# unset value fails loudly instead of silently leaving admin/admin.
#
# Grafana applies that password only when it first initialises its database.
# With an existing grafana-data volume the original password stays in force
# and the variable is ignored — measured 2026-08-11, where admin/admin still
# authenticated after the variable was changed. `docker compose down -v`
# resets it, at the cost of deleting the volume.
#
# The scrape target is in prometheus/prometheus.yml. It defaults to
# host.docker.internal:9228, which reaches an exporter running on this Docker
# host. For an exporter elsewhere, edit that file — there is no environment
# override, because a variable that silently fails to apply is worse than
# editing the file.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cee-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    # host.docker.internal lets the container reach an exporter running on the
    # host without host networking; on Linux this needs the mapping below.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: cee-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Set this in the shell or an .env file before first start.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD before starting}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
