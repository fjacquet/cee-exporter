site_name: cee-exporter
site_description: Dell PowerStore CEPA audit events → Windows EventLog / GELF
site_url: https://fjacquet.github.io/cee-exporter/
repo_url: https://github.com/fjacquet/cee-exporter
repo_name: fjacquet/cee-exporter
edit_uri: edit/main/docs/

# SITE_FOOTER is exported by the fjacquet/ci mkdocs-publish composite action,
# derived fresh from `git describe`/the triggering tag on every build — see
# https://github.com/fjacquet/ci/blob/main/actions/mkdocs-publish/action.yml.
# This replaces a hand-maintained `extra.version` key, which stated v4.1.1
# after the project had already moved to v4.1.2: nothing in this theme ever
# rendered `extra.version`, so the drift went unnoticed for a full release.
# `copyright` IS rendered, in the site footer, by mkdocs-material — so this
# value cannot go stale without the footer itself visibly saying so. Local
# `make docs` runs without SITE_FOOTER set and falls back to the empty string.
copyright: !ENV [SITE_FOOTER, ""]

docs_dir: docs

exclude_docs: |
  archive/

nav:
  - Home: index.md
  - Operator Guide: operator-guide.md
  - Promises: PROMISES.md
  - Product Requirements: PRD.md
  - Requirements Traceability: requirements.md
  - Windows Verification Protocol: windows-verification.md
  - Architecture Decisions:
      - ADR-001 Language (Go): adr/ADR-001-language-go.md
      - ADR-002 GELF Primary Output: adr/ADR-002-gelf-primary-linux.md
      - ADR-003 Async Queue: adr/ADR-003-async-queue.md
      - ADR-004 Binary EVTX Deferred: adr/ADR-004-binary-evtx-deferred.md
      - ADR-005 CGO Disabled: adr/ADR-005-cgo-disabled.md
      - ADR-006 Prometheus Port: adr/ADR-006-prometheus-separate-port.md
      - ADR-007 Windows Service: adr/ADR-007-windows-svc-x-sys.md
      - ADR-008 RFC5424 Syslog: adr/ADR-008-rfc5424-crewjam.md
      - ADR-009 BinaryEvtx Scratch: adr/ADR-009-binary-evtx-scratch.md
      - ADR-010 Windows SCM: adr/ADR-010-kardianos-service-windows-scm.md
      - ADR-011 TLS Automation: adr/ADR-011-tls-certificate-automation.md
      - ADR-012 Flush Ticker Ownership: adr/ADR-012-flush-ticker-ownership.md
      - ADR-013 Write-on-Close Model: adr/ADR-013-write-on-close-model.md
      - ADR-014 go-evtx Extraction: adr/ADR-014-go-evtx-library-extraction.md
      - ADR-015 Windows Message Resource: adr/ADR-015-windows-message-resource.md
      - ADR-016 Three-Oracle EVTX Verification: adr/ADR-016-three-oracle-evtx-verification.md
  - v2 Research: v2-research.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    scheme: default
    primary: indigo
    accent: blue
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - tables
  - toc:
      permalink: true
