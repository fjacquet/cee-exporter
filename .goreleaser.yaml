version: 2

project_name: cee-exporter

before:
  hooks:
    - go mod tidy
    # The scratch image needs a CA bundle in the build context. The system
    # bundle exists at this path on the Linux release runner; the curl
    # fallback covers macOS and any host without it.
    - sh -c "cp /etc/ssl/certs/ca-certificates.crt . 2>/dev/null || curl -sSfLo ca-certificates.crt https://curl.se/ca/cacert.pem"

builds:
  - id: cee-exporter
    main: ./cmd/cee-exporter
    binary: cee-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cee-exporter
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers:
  - id: cee-exporter-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - id: cee-exporter-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/fjacquet/cee-exporter:{{ .Version }}"
    image_templates:
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-amd64"
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/fjacquet/cee-exporter:latest"
    image_templates:
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-amd64"
      - "ghcr.io/fjacquet/cee-exporter:{{ .Version }}-arm64"

sboms:
  - id: cyclonedx-gomod
    artifacts: any
    cmd: cyclonedx-gomod
    args:
      - mod
      - -licenses
      - -json
      - -output
      - $document
      - ../
    documents:
      - "{{ .ProjectName }}_{{ .Version }}.sbom.cdx.json"

changelog:
  use: github-native

release:
  prerelease: auto
