name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: fjacquet/ci/.github/workflows/go-ci.yml@v1

  security:
    uses: fjacquet/ci/.github/workflows/go-security.yml@v1

  # First job in this repo's history to execute writer_windows.go and
  # service_windows.go. `make ci` runs on Linux, where //go:build windows
  # excludes both files from the compiler entirely — a Windows-only change
  # could be green on every other check and still be broken.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Runs as Administrator on GitHub-hosted Windows runners, which the
      # event-source registration tests require.
      #
      # -race needs cgo and a C compiler. Measured on winvm (2026-08-09):
      # `go test -race` fails there with "requires cgo" because that host has
      # no C toolchain. GitHub's windows-latest image does ship mingw gcc, so
      # -race is expected to work here — but verify it rather than assume,
      # because the failure mode is a red job for a reason unrelated to the
      # code. The check below turns an absent compiler into a clear skip
      # instead of a confusing build error.
      - name: Run tests
        shell: pwsh
        run: |
          $cc = Get-Command gcc -ErrorAction SilentlyContinue
          if ($null -eq $cc) {
            Write-Host "::warning::no C compiler on this runner - running without -race"
            go test ./...
          } else {
            Write-Host "C compiler: $($cc.Source)"
            go test -race ./...
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: go build -o cee-exporter.exe ./cmd/cee-exporter

      # The assertion the message resource exists for. A failure here means
      # Event Viewer would show "The description for Event ID N ... cannot be
      # found" to every operator.
      - name: Assert Event Viewer renders real text, not the placeholder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Registers the source against cee-exporter.exe and writes one event
          # per mapped ID.
          .\cee-exporter.exe -emit-test-events

          # Measured on Windows Server 2025 (2026-08-09) against a source
          # deliberately registered the broken way:
          #
          #   Get-WinEvent .Message  -> $null
          #   Get-EventLog .Message  -> "The description for Event ID '4663'
          #                              in Source '...' cannot be found. ..."
          #
          # So the placeholder string NEVER appears in Get-WinEvent output.
          # Searching Get-WinEvent for it would pass on broken output — a
          # guard that cannot fail. Both cmdlets are checked instead:
          # Get-WinEvent for a non-null resolved message, Get-EventLog for the
          # absence of the placeholder.
          #
          # A resolved, non-null message is NOT enough on its own: "Object
          # Name:" and the rest of the payload body come from the %1
          # insertion string, which is present regardless of what the message
          # resource's own description text says. A resource with a missing
          # or swapped description (e.g. 4670 carrying 4663's text) passes
          # every check above it and would still ship silently broken. So
          # each ID's expected description line — the part the resource is
          # actually responsible for — is asserted explicitly too.
          $placeholder = 'cannot be found'
          $expectedDescriptions = @{
            4660 = 'An object was deleted.'
            4663 = 'An attempt was made to access an object.'
            4670 = 'Permissions on an object were changed.'
          }
          $ids = @(4660, 4663, 4670)
          $failed = $false

          foreach ($id in $ids) {
            $ev = Get-WinEvent -FilterHashtable @{
              LogName      = 'Application'
              ProviderName = 'PowerStore-CEPA'
              Id           = $id
            } -MaxEvents 1 -ErrorAction Stop

            # An unresolvable message is $null here, not placeholder text.
            if ($null -eq $ev.Message) {
              Write-Host "::error::event $id has no resolvable description - the message resource is not being found"
              $failed = $true
              continue
            }
            if ($ev.Message -notlike '*Object Name:*') {
              Write-Host "::error::event $id is missing the payload body: $($ev.Message)"
              $failed = $true
              continue
            }
            if ($ev.Message -notlike "*$($expectedDescriptions[$id])*") {
              Write-Host "::error::event $id resolved a message but not its own description - expected to contain '$($expectedDescriptions[$id])', got: $($ev.Message)"
              $failed = $true
              continue
            }

            # Get-EventLog is where the placeholder text actually surfaces,
            # and is closer to what Event Viewer shows an operator.
            $old = Get-EventLog -LogName Application -Source 'PowerStore-CEPA' -Newest 20 |
                   Where-Object { $_.EventID -eq $id } | Select-Object -First 1
            if ($null -eq $old) {
              Write-Host "::error::event $id was not found via Get-EventLog - cannot confirm the placeholder is absent"
              $failed = $true
              continue
            }
            if ($old.Message -like "*$placeholder*") {
              Write-Host "::error::event $id renders the placeholder: $($old.Message)"
              $failed = $true
              continue
            }

            Write-Host "event $id renders correctly"
          }

          if ($failed) { exit 1 }

      # install/uninstall only exercise kardianos's SCM registration helpers.
      # Nothing before this step ever called sc.exe start, so
      # svcProgram.Start/Stop in service_windows.go — the code that actually
      # runs when the SCM starts and stops the service, including the only
      # shutdown path Windows offers it (no POSIX signals) — had never
      # executed. This exercises that body directly, not just registration.
      - name: Service install/uninstall round-trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          .\cee-exporter.exe install
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::install exited $LASTEXITCODE"; exit 1 }

          sc.exe query cee-exporter
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::sc.exe query exited $LASTEXITCODE"; exit 1 }

          sc.exe start cee-exporter
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::sc.exe start exited $LASTEXITCODE"; exit 1 }

          # sc.exe start returns once the request is accepted, not once the
          # service reaches Running - poll briefly rather than assume either
          # state on the first read.
          $running = $false
          for ($i = 0; $i -lt 10; $i++) {
            $svc = Get-Service -Name cee-exporter
            if ($svc.Status -eq 'Running') { $running = $true; break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "service status after start: $($svc.Status)"
          if (-not $running) {
            Write-Host "::error::service did not reach Running state after sc.exe start (last observed: $($svc.Status))"
            exit 1
          }

          sc.exe stop cee-exporter
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::sc.exe stop exited $LASTEXITCODE"; exit 1 }

          $stopped = $false
          for ($i = 0; $i -lt 10; $i++) {
            $svc = Get-Service -Name cee-exporter
            if ($svc.Status -eq 'Stopped') { $stopped = $true; break }
            Start-Sleep -Milliseconds 500
          }
          Write-Host "service status after stop: $($svc.Status)"
          if (-not $stopped) {
            Write-Host "::error::service did not reach Stopped state after sc.exe stop (last observed: $($svc.Status))"
            exit 1
          }

          .\cee-exporter.exe uninstall
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::uninstall exited $LASTEXITCODE"; exit 1 }

  # Produces the .evtx that evtx-readback reads, and checks it with an
  # independent parser on the way past.
  #
  # This job exists on Linux because it has to. pkg/evtx/writer_evtx_notwindows.go
  # carries //go:build !windows, so the Windows runner cannot compile
  # BinaryEvtxWriter at all — it cannot produce the file it needs to read. The
  # artifact hop is the only available shape, and it is also the correct one:
  # the promise in OUT-06 is about files generated on Linux.
  #
  # python-evtx is a genuine second opinion on structure and covers the
  # "parse with forensics tools" half of OUT-06. It is NOT the proof that
  # Windows can read the file: measured on 2026-08-09, it parses the v0.6.0
  # output that Get-WinEvent rejects as "The event log file is corrupted".
  # That proof is evtx-readback's job.
  evtx-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Exact release, not a bare major. astral-sh/setup-uv publishes no
      # moving `v9` tag — its highest bare-major alias is `v7`, while the
      # current release is `v9.0.0`. `@v9` therefore fails the job at action
      # resolution, before a single step runs:
      #   Unable to resolve action `astral-sh/setup-uv@v9`, unable to find version `v9`
      # Reading the latest release name is not the same as checking the ref
      # resolves. The other actions here do publish moving majors and use them.
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Emit a .evtx with the three mapped event IDs
        run: |
          set -euo pipefail
          # Only [output] is read on this path: -emit-test-events exits before
          # the HTTP listener or the metrics server binds, so a [listen] or
          # [metrics] address here would suggest they are exercised when they
          # are not. evtx_path is required by config validation.
          cat > /tmp/evtx-ci.toml <<'TOML'
          [output]
          type = "evtx"
          evtx_path = "/tmp/audit.evtx"
          TOML
          go run ./cmd/cee-exporter -config /tmp/evtx-ci.toml -emit-test-events
          test -s /tmp/audit.evtx

      # --frozen refuses to update uv.lock, which pins python-evtx 0.8.1. A
      # silently-upgraded parser would change what this gate means without
      # anyone choosing it.
      - name: Verify with python-evtx
        working-directory: tools/evtx-debug
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run python verify_evtx.py /tmp/audit.evtx

      - uses: actions/upload-artifact@v7
        with:
          name: evtx-sample
          path: /tmp/audit.evtx
          if-no-files-found: error
          retention-days: 7

  # The proof behind OUT-06. Reads the Linux-generated file with the tool an
  # operator would use.
  #
  # Kept separate from the `windows` job on purpose. Folding it in would light
  # one runner instead of two, but `needs: evtx-oracle` would then mean a
  # failure in this new oracle stops the message-resource and SCM-lifecycle
  # assertions from running at all. Trading established coverage for a minute
  # of runner time is the wrong direction.
  evtx-readback:
    runs-on: windows-latest
    needs: evtx-oracle
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: evtx-sample
          path: .

      - name: Get-WinEvent must read what BinaryEvtxWriter wrote
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'audit.evtx'

          # Assertion 1: the file is readable at all. This is the one that
          # fails on pre-v0.7.0 output, with "The event log file is corrupted"
          # — measured on Windows Server 2025, 2026-08-09. It dies here before
          # reaching any record.
          try {
            $events = @(Get-WinEvent -Path $path -ErrorAction Stop)
          } catch {
            Write-Host "::error::Get-WinEvent could not read the file: $($_.Exception.Message)"
            exit 1
          }

          # Assertion 2: nothing was silently lost. A writer that dropped two
          # of three events would still produce a readable file.
          if ($events.Count -ne 3) {
            Write-Host "::error::expected 3 records, got $($events.Count)"
            exit 1
          }

          # Assertion 3: the IDs, as a SET. Get-WinEvent enumerates
          # newest-first — measured 4670,4660,4663 for events written
          # 4663,4660,4670 — so an ordered comparison fails for a reason that
          # has nothing to do with correctness.
          $got = ($events | ForEach-Object { $_.Id } | Sort-Object) -join ','
          if ($got -ne '4660,4663,4670') {
            Write-Host "::error::event IDs were [$got], expected [4660,4663,4670]"
            exit 1
          }

          # Assertions 4 and 5, per record: ToXml is what v0.7.0 fixes, and
          # the ObjectName check stops a parse that succeeds while rendering
          # nothing from passing.
          #
          # Deliberately NOT asserted: .Message and .LogName. Both are empty
          # when the event source is not registered on the host, which says
          # nothing about whether the file is well-formed. Asserting them
          # would make this job fail on a correct file.
          foreach ($e in $events) {
            try {
              $xml = $e.ToXml()
            } catch {
              Write-Host "::error::record $($e.Id): ToXml failed: $($_.Exception.Message)"
              exit 1
            }
            if ($xml -notmatch [regex]::Escape('C:\test\emit-test-events.txt')) {
              Write-Host "::error::record $($e.Id): ObjectName missing from the rendered XML"
              exit 1
            }
            Write-Host "record $($e.Id): ToXml ok, $($xml.Length) chars, ObjectName present"
          }

          Write-Host "Get-WinEvent read 3 records from a Linux-generated .evtx"
