name: Docs Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-phantom-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Guards against reintroducing config keys the code does not accept.
      # Both of these were documented for months: type = "binary-evtx" is
      # rejected at startup, and acme_staging silently no-ops.
      #
      # Excluded, on purpose, as frozen historical records rather than
      # operator-facing documentation — none of them are reachable from
      # docs/index.md's "Documentation" list as current guidance, and none
      # of them are docs/operator-guide.md or docs/index.md, which are the
      # only files this check exists to protect:
      #   docs/adr/       — ADRs are immutable once accepted (Nygard
      #                     convention); superseded by a new ADR, never edited.
      #   docs/research/  — dated phase-by-phase research archive, kept
      #                     verbatim as a record of what was investigated.
      #   docs/v2-research.md — same: point-in-time research notes.
      #   docs/superpowers/    — planning/spec working docs that describe
      #                          the bug this very workflow guards against.
      # This exclusion list is path-based and narrow: it does not touch
      # docs/operator-guide.md, docs/index.md, README.md, or any config.toml*,
      # so a phantom key reintroduced into real operator docs still fails.
      - name: Reject documented-but-nonexistent config keys
        run: |
          set -euo pipefail
          fail=0

          # type = "binary-evtx" — not in buildWriter's switch. The final
          # grep -v strips docs/index.md's ADR-004/ADR-009 link lines —
          # those name real historical ADR files, not a config value.
          if grep -rn 'binary-evtx' docs/ README.md config.toml config.toml.example \
               --include='*.md' --include='*.toml' \
               --exclude-dir=adr --exclude-dir=research --exclude-dir=superpowers \
               --exclude=v2-research.md \
             | grep -v 'ADR-004\|ADR-009'; then
            echo "::error::'binary-evtx' is not a valid output type. Use 'evtx'."
            fail=1
          fi

          # acme_staging — no such field in ListenConfig.
          if grep -rn 'acme_staging' docs/ README.md config.toml config.toml.example \
               --include='*.md' --include='*.toml' \
               --exclude-dir=adr --exclude-dir=research --exclude-dir=superpowers \
               --exclude=v2-research.md; then
            echo "::error::'acme_staging' does not exist in ListenConfig."
            fail=1
          fi

          exit $fail

      # Every documented output type must appear in buildWriter's switch.
      - name: Verify documented output types exist in code
        run: |
          set -euo pipefail
          for t in gelf evtx multi syslog beats; do
            grep -q "case \"$t\":" cmd/cee-exporter/main.go \
              || { echo "::error::documented type '$t' has no case in buildWriter"; exit 1; }
          done
