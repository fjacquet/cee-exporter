name: Docs Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-phantom-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Guards against reintroducing config keys the code does not accept.
      # Both of these were documented for months: type = "binary-evtx" is
      # rejected at startup, and acme_staging silently no-ops.
      #
      # Exemptions below are per-FILE, not per-directory-as-a-whole, and each
      # names exactly why. This matters: docs/v2-research.md and docs/adr/ are
      # linked from docs/index.md's "Documentation" list (mkdocs also builds
      # every .md under docs_dir regardless of nav membership), so they are
      # published, reachable pages, not blanket-exempt just for being "docs".
      # Only docs/research/** and docs/superpowers/** are excluded wholesale:
      #   docs/research/** — dated phase-by-phase research archive, banner-
      #                       marked at docs/research/index.md as historical,
      #                       not current guidance (not yet in mkdocs nav).
      #   docs/superpowers/** — planning/spec working docs that describe the
      #                          bug this very workflow guards against.
      # Everything else, including docs/adr/ and docs/v2-research.md, IS
      # scanned. Two distinct exemption shapes are used below, chosen per
      # where the legitimate occurrence actually lives (verified by running
      # the greps, not assumed) — a *file-content* match is not the same
      # thing as a *file-path* match, and conflating them either reopens a
      # co-location bypass or turns the guard permanently red on a real link:
      #
      #   binary-evtx: ADR-004-binary-evtx-deferred.md and
      #   ADR-009-binary-evtx-scratch.md never use the literal lowercase
      #   "binary-evtx" string in their own body (only "BinaryEvtxWriter"),
      #   so anchoring to *those files'* path prefix would exempt nothing —
      #   the real hits are the markdown links to them from docs/index.md and
      #   docs/v2-research.md. Anchoring by *source file* there would exempt
      #   those files wholesale, hiding a phantom key placed anywhere else on
      #   the same page — including docs/index.md, one of the two files this
      #   guard exists to protect. So this check strips only the exact link
      #   target substring "(adr/ADR-00{4,9}-...-....md)" from each hit line
      #   and re-checks what's left: a bare link disappears, but
      #   `type = "binary-evtx"` sitting next to that same link on one line
      #   survives and still fails the build.
      #
      #   acme_staging: the only legitimate occurrence is inside
      #   ADR-011-tls-certificate-automation.md's own Consequences section
      #   (the preserved original claim plus its correction banner) — no
      #   other file's line ever combines "acme_staging" with a mention of
      #   ADR-011, so a straight file-path anchor is precise here and does
      #   not need substring surgery.
      - name: Reject documented-but-nonexistent config keys
        run: |
          set -euo pipefail
          fail=0

          # type = "binary-evtx" — not in buildWriter's switch. Strips only
          # the exact markdown link target for the two historical ADRs, then
          # re-checks the remainder of each line — so a phantom-key line
          # placed next to one of those links (e.g. in docs/index.md itself)
          # still fails, while the bare links themselves do not.
          if grep -rn 'binary-evtx' docs/ README.md config.toml config.toml.example \
               --include='*.md' --include='*.toml' \
               --exclude-dir=research --exclude-dir=superpowers \
             | sed -E 's#\(adr/ADR-004-binary-evtx-deferred\.md\)##g; s#\(adr/ADR-009-binary-evtx-scratch\.md\)##g' \
             | grep 'binary-evtx'; then
            echo "::error::'binary-evtx' is not a valid output type. Use 'evtx'."
            fail=1
          fi

          # acme_staging — no such field in ListenConfig. Anchored to the
          # start of the line so only hits whose SOURCE FILE is ADR-011 are
          # exempt — a line in any other file that merely mentions ADR-011's
          # filename as text does not match this anchor and still fails.
          if grep -rn 'acme_staging' docs/ README.md config.toml config.toml.example \
               --include='*.md' --include='*.toml' \
               --exclude-dir=research --exclude-dir=superpowers \
             | grep -v '^docs/adr/ADR-011-tls-certificate-automation\.md:'; then
            echo "::error::'acme_staging' does not exist in ListenConfig."
            fail=1
          fi

          exit $fail

      # Every documented output type must appear in buildWriter's switch.
      - name: Verify documented output types exist in code
        run: |
          set -euo pipefail
          for t in gelf evtx multi syslog beats; do
            grep -q "case \"$t\":" cmd/cee-exporter/main.go \
              || { echo "::error::documented type '$t' has no case in buildWriter"; exit 1; }
          done
